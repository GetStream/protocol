name: TypeScript Video Proto

on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protoc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build generator image
        run: docker build -t protobuf-generate:ci .

      - name: Compile definitions
        run: docker run --rm --user "$(id -u):$(id -g)" -v $(pwd):/local protobuf-generate:ci ts /local/ts-sdk
