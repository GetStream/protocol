name: TypeScript Video Proto

on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  protoc:
    runs-on: ubuntu-latest
    steps:
      - name: Compile definitions
        run: docker run --user "$(id -u):$(id -g)" -v $(pwd):/local ghcr.io/getstream/protobuf-generate ts /local/ts-sdk
